version: '3.8'

services:
  core:
    image: pihole/pihole:latest
    networks:
      - web-net
    
    # We bypass the Swarm routing mesh for DNS so Pi-hole can see real client IPs!
    ports:
      - target: 53
        published: 53
        protocol: tcp
        mode: host
      - target: 53
        published: 53
        protocol: udp
        mode: host
        
    environment:
      - TZ=Europe/Paris  # Sets the correct timezone for your logs
      - FTLCONF_webserver_api_password=ROSeng7i  # Change this!
      
      # Optional: Helps prevent DNS loops
      - FTLCONF_LOCAL_IPV4=10.0.0.1  # Change to the VPN/Local IP of the Mac Mini
      
    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d
      
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == liaxum-vps
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        
        # Access the dashboard at https://pihole.liaxum.fr
        - "traefik.http.routers.pihole.rule=Host(`pihole.liaxum.fr`)"
        - "traefik.http.routers.pihole.entrypoints=websecure"
        - "traefik.http.routers.pihole.tls=true"
        
        # Pi-hole's web interface runs on port 80 internally
        - "traefik.http.services.pihole.loadbalancer.server.port=80"
        
        # Pi-hole requires /admin at the end of the URL. This middleware adds it automatically!
        - "traefik.http.middlewares.pihole-redirect.redirectregex.regex=^https://pihole.liaxum.fr/$$"
        - "traefik.http.middlewares.pihole-redirect.redirectregex.replacement=https://pihole.liaxum.fr/admin/"
        - "traefik.http.routers.pihole.middlewares=pihole-redirect"

networks:
  web-net:
    external: true

volumes:
  pihole-etc:
  pihole-dnsmasq: