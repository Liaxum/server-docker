# docker stack deploy -c apps/pihole/compose.yml pihole
#
# Network-wide DNS for the mesh, pinned to the VPS.
#
# Values come from the stack environment. Everything has a default that matches
# this cluster except PIHOLE_PASSWORD, which is required and fails the deploy if
# it is missing -- see "Pi-hole and port 53" in the README for the full list and
# for how Komodo supplies them.
#
# BEFORE FIRST DEPLOY, read "Pi-hole and port 53" in the README. Swarm cannot
# bind a published port to one address, so this listens on 53 on EVERY
# interface of the manager -- the public one included. An open resolver on a
# public IP is found by scanners within hours and used for DNS amplification,
# which is the kind of thing hosting providers null-route a server for. The
# firewall rules in the README are not optional hardening; without them this
# service should not be deployed.
services:
  core:
    image: pihole/pihole:latest
    networks:
      - web-net

    # Host mode, not the swarm routing mesh: the mesh source-NATs every query
    # to the ingress network's address, so Pi-hole would attribute all traffic
    # to one client and per-client stats and rules would be meaningless.
    #
    # Swarm's long port syntax has no host_ip field -- it is documented as
    # unsupported in swarm -- so this binds 0.0.0.0:53 and cannot be narrowed
    # here. apps/nfs/compose.yml solves the same problem by not being a swarm
    # stack at all, which is not an option for a service that needs Traefik's
    # swarm provider to route its web UI. Hence the firewall.
    ports:
      - target: 53
        published: 53
        protocol: tcp
        mode: host
      - target: 53
        published: 53
        protocol: udp
        mode: host

    environment:
      - TZ=${TZ:-Europe/Paris}

      # Required, with no default on purpose. A plain ${VAR} interpolates to
      # an empty string when unset, silently, and an empty Pi-hole API password
      # means the admin UI stops asking for one -- a footgun that only shows up
      # when someone finds the panel. ":?" makes the deploy fail instead.
      #
      # This is the main reason to use the stack environment at all: the
      # password stops living in the file, and so stops living in git. The one
      # that was committed here before is in the history and is burned.
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in the stack environment}

      # Stated rather than left to the image default, and matched to the
      # nameservers headscale hands out in apps/vpn/config.yaml.template so
      # mesh clients get the same answers whichever resolver they reach.
      # v6 syntax: semicolon separated.
      - FTLCONF_dns_upstreams=${PIHOLE_UPSTREAMS:-1.1.1.1;8.8.8.8}

      # Stated explicitly because the default does not suit this topology.
      # Pi-hole's other listening modes decide "local" from its own interface
      # addresses, and this container only ever sees the overlay (10.x) and
      # the gwbridge (172.x) -- so a mesh client at 100.64.0.4 looks foreign
      # and its queries would be refused. ALL is what makes mesh clients work.
      #
      # The cost is that nothing inside Pi-hole limits who may query it, so
      # the firewall rules in the README are the only thing standing between
      # this and an open resolver. Do not deploy without them.
      - FTLCONF_dns_listeningMode=ALL

    volumes:
      - pihole-etc:/etc/pihole
      - pihole-dnsmasq:/etc/dnsmasq.d

    deploy:
      replicas: 1
      placement:
        constraints:
          # Defaulted, never bare. An unset ${MANAGER_HOSTNAME} would leave
          # "node.hostname == ", which matches no node at all: the service sits
          # at 0/1 forever and nothing explains why.
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}

      # Without a limit, a task that cannot bind 53 -- systemd-resolved holding
      # it is the usual reason -- is recreated every few seconds forever. Three
      # attempts then stop, so the failure is visible in `docker service ps`
      # instead of buried under a churn of new task IDs.
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s

      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"

        - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_SUBDOMAIN:-pihole}.${DOMAIN:-liaxum.fr}`)"
        - "traefik.http.routers.pihole.entrypoints=websecure"
        - "traefik.http.routers.pihole.tls=true"

        # Pi-hole v6 serves the UI from its own embedded webserver on 80.
        - "traefik.http.services.pihole.loadbalancer.server.port=80"

        # The UI lives under /admin and the bare host 404s, so send / there.
        # $$ is an escaped $ -- compose interpolates the file before swarm sees
        # it, and a single $ would be eaten.
        - "traefik.http.middlewares.pihole-redirect.redirectregex.regex=^https://${PIHOLE_SUBDOMAIN:-pihole}.${DOMAIN:-liaxum.fr}/$$"
        - "traefik.http.middlewares.pihole-redirect.redirectregex.replacement=https://${PIHOLE_SUBDOMAIN:-pihole}.${DOMAIN:-liaxum.fr}/admin/"
        - "traefik.http.routers.pihole.middlewares=pihole-redirect"

networks:
  web-net:
    external: true

volumes:
  pihole-etc:
  pihole-dnsmasq:
