networks:
  web-net:
    external: true

configs:
  # Docker config objects are immutable, so re-rendering these with changed
  # content cannot update them in place ("only updates to Labels are allowed").
  # Naming them after a hash of their content makes a change create a new
  # object that the service is pointed at instead. bootstrap.sh sets the
  # hashes; the defaults keep a manual deploy working.
  headscale_config:
    file: ./config.yaml
    name: headscale_config_${HEADSCALE_CONFIG_HASH:-manual}
  headplane_config:
    file: ./headplane_config.yaml
    name: headplane_config_${HEADPLANE_CONFIG_HASH:-manual}

services:
  core:
    image: docker.io/headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    command: serve
    configs:
      - source: headscale_config
        target: /etc/headscale/config.yaml
    volumes:
      - /opt/vpn/data:/var/lib/headscale
    networks:
      - web-net
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.headscale.rule=Host(`${VPN_SUBDOMAIN:-vpn}.${DOMAIN:-liaxum.fr}`)"
        - "traefik.http.routers.headscale.entrypoints=websecure"
        - "traefik.http.routers.headscale.tls=true"
        - "traefik.http.routers.headscale.tls.certresolver=letsencrypt"
        - "traefik.http.services.headscale.loadbalancer.server.port=8080"

  web:
    image: ghcr.io/tale/headplane:latest
    networks:
      - web-net
    configs:
      - source: headplane_config
        target: /etc/headplane/config.yaml
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        # Access it via a specific subdomain or path
        - "traefik.http.routers.headplane.rule=Host(`${VPN_SUBDOMAIN:-vpn}.${DOMAIN:-liaxum.fr}`) && PathPrefix(`/admin`)"
        - "traefik.http.routers.headplane.entrypoints=websecure"
        - "traefik.http.routers.headplane.tls=true"
        - "traefik.http.services.headplane.loadbalancer.server.port=3000"