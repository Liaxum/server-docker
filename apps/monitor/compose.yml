services:
  db:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - komodo-net
    deploy:
      placement:
        constraints:
          - node.hostname == liaxum-vps

  core:
    image: ghcr.io/moghtech/komodo-core:2
    environment:
      - KOMODO_DATABASE_ADDRESS=db:27017
      - KOMODO_JWT_SECRET=super_secret_jwt_12345
      - KOMODO_WEBHOOK_SECRET=super_secret_webhook_12345
      - KOMODO_LOCAL_AUTH=true
    volumes:
      - keys:/config/keys
    networks:
      - web-net
      - komodo-net
    deploy:
      placement:
        constraints:
          - node.hostname == liaxum-vps
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        - "traefik.http.routers.komodo.rule=Host(`monitor.liaxum.fr`)"
        - "traefik.http.routers.komodo.entrypoints=websecure"
        - "traefik.http.routers.komodo.tls=true"
        - "traefik.http.services.komodo.loadbalancer.server.port=9120"

  agent:
    image: ghcr.io/moghtech/komodo-periphery:2
    environment:
      - PERIPHERY_CORE_ADDRESS=wss://monitor.liaxum.fr
      - PERIPHERY_CONNECT_AS={{ .Node.Hostname }}
      - PERIPHERY_CORE_PUBLIC_KEYS=file:/config/keys/core.pub
      - PERIPHERY_ONBOARDING_KEY=O_MtvPL47OpYgEqArluFsbv6nXjR0U_O
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
    networks:
      - komodo-net
    deploy:
      mode: global
  
  mcp:
    image: ghcr.io/myrikld/komodo-mcp:latest
    environment:
      - KOMODO_MCP_KOMODO_URL=https://monitor.liaxum.fr
      - KOMODO_MCP_KOMODO_API_KEY=K_d7XqOnTpGduUmUH74C7t8iwhhCgYN4qqgczNGN64_K
      - KOMODO_MCP_KOMODO_API_SECRET=S_7nqRoUAZtzENIX0slKeb2siVleJfUg1j7beWUTmM_S
    networks:
      - web-net
      - komodo-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == liaxum-vps
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        # We will expose this on a separate subdomain for the AI
        - "traefik.http.routers.komodomcp.rule=Host(`mcp.liaxum.fr`)"
        - "traefik.http.routers.komodomcp.entrypoints=websecure"
        - "traefik.http.routers.komodomcp.tls=true"
        - "traefik.http.services.komodomcp.loadbalancer.server.port=8000"

networks:
  web-net:
    external: true
  komodo-net:
    driver: overlay
    attachable: true

volumes:
  mongo-data:
  mongo-config:
  keys:
    driver: local
    driver_opts:
      type: "nfs"
      # Put your VPS Tailscale IP here!
      o: "addr=100.64.0.1,rw,nfsvers=4,nolock,soft"
      # Points directly to the folder you made in Filebrowser!
      device: ":/shared/monitor-keys"