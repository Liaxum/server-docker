# docker stack deploy -c apps/monitor/compose.yml monitor
#
# The `agent` service runs globally, so periphery instances land on remote
# hardware that cannot see core's local /config/keys. The `keys` volume is an
# NFS mount of /shared/monitor-keys exported by apps/nfs over Tailscale, which
# is how the agents pick up the core.pub that core writes.
#
# That share is READ-ONLY for the agents, and is not where they keep their own
# keys. Periphery generates its own keypair in its keys directory at boot and
# registers the public half with core, which records it against that one
# server. A global service pointed at a shared directory therefore has every
# node writing one keypair: whichever agent regenerates last takes the others'
# identity with it, and core rejects the rest with
#
#   Core failed to validate Periphery public key
#   Ensure public key matches configured Periphery Public Key
#
# So each agent gets a private, node-local volume for its own keys, and reads
# core.pub from the share separately.
services:
  db:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - komodo-net
    deploy:
      placement:
        constraints:
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}

  core:
    image: ghcr.io/moghtech/komodo-core:2
    environment:
      - KOMODO_DATABASE_ADDRESS=db:27017
      - KOMODO_JWT_SECRET=super_secret_jwt_12345
      - KOMODO_WEBHOOK_SECRET=super_secret_webhook_12345
      - KOMODO_LOCAL_AUTH=true
    volumes:
      - keys:/config/keys
    networks:
      - web-net
      - komodo-net
    deploy:
      placement:
        constraints:
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        - "traefik.http.routers.komodo.rule=Host(`${MONITOR_SUBDOMAIN:-monitor}.${DOMAIN:-liaxum.fr}`)"
        - "traefik.http.routers.komodo.entrypoints=websecure"
        - "traefik.http.routers.komodo.tls=true"
        - "traefik.http.services.komodo.loadbalancer.server.port=9120"

  agent:
    image: ghcr.io/moghtech/komodo-periphery:2
    environment:
      - PERIPHERY_CORE_ADDRESS=wss://${MONITOR_SUBDOMAIN:-monitor}.${DOMAIN:-liaxum.fr}
      - PERIPHERY_CONNECT_AS={{ .Node.Hostname }}
      # Read out of the share, which is mounted read-only below. Core writes
      # this file; no agent ever should.
      - PERIPHERY_CORE_PUBLIC_KEYS=file:/config/core/core.pub
      # Created in the Komodo UI once core is running, so it cannot be known
      # at first deploy. bootstrap.sh asks for it and redeploys.
      - PERIPHERY_ONBOARDING_KEY=${KOMODO_ONBOARDING_KEY:-}
      - PERIPHERY_ROOT_DIRECTORY=${KOMODO_ROOT_DIR:-/etc/komodo}
    volumes:
      # Node-local and private. The local driver gives each node its own
      # instance of a named volume, so every agent generates and keeps its own
      # periphery keypair here and the identities stay distinct.
      - agent-keys:/config/keys
      # The share, read-only, purely to read core.pub. :ro is the guard that
      # keeps a future periphery release from writing its keys here and
      # recreating the collision.
      - keys:/config/core:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Periphery clones repos and writes the compose files of Komodo-managed
      # stacks under PERIPHERY_ROOT_DIRECTORY, then drives the *host* daemon
      # through the socket above -- which resolves those paths on the host, not
      # in here. Binding the directory at the same path on both sides is what
      # makes the two readings name one directory; see
      # https://github.com/moghtech/komodo/discussions/180. It also outlives
      # the task, which a container-only path would not.
      - ${KOMODO_ROOT_DIR:-/etc/komodo}:${KOMODO_ROOT_DIR:-/etc/komodo}
    networks:
      - komodo-net
    deploy:
      mode: global

  mcp:
    image: ghcr.io/myrikld/komodo-mcp:latest
    environment:
      - KOMODO_MCP_KOMODO_URL=https://${MONITOR_SUBDOMAIN:-monitor}.${DOMAIN:-liaxum.fr}
      - KOMODO_MCP_KOMODO_API_KEY=K_d7XqOnTpGduUmUH74C7t8iwhhCgYN4qqgczNGN64_K
      - KOMODO_MCP_KOMODO_API_SECRET=S_7nqRoUAZtzENIX0slKeb2siVleJfUg1j7beWUTmM_S
    networks:
      - web-net
      - komodo-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        # We will expose this on a separate subdomain for the AI
        - "traefik.http.routers.komodomcp.rule=Host(`${MCP_SUBDOMAIN:-mcp}.${DOMAIN:-liaxum.fr}`)"
        - "traefik.http.routers.komodomcp.entrypoints=websecure"
        - "traefik.http.routers.komodomcp.tls=true"
        - "traefik.http.services.komodomcp.loadbalancer.server.port=8000"

networks:
  web-net:
    external: true
  komodo-net:
    driver: overlay
    attachable: true

volumes:
  mongo-data:
  mongo-config:
  # Per-node, not shared: see the note at the top of this file.
  agent-keys:
  keys:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${MESH_ADDR:-100.64.0.1},rw,nfsvers=4,nolock,soft,nosuid,nodev"
      # Path is relative to the NFSv4 root, which the export pins to /shared
      # with fsid=0 -- so this is /shared/monitor-keys on the server.
      device: ":/monitor-keys"