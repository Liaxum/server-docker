version: '3.8'

services:
  # --- 1. Database (MongoDB) ---
  mongo:
    image: mongo:latest   # <--- Updated to Latest
    volumes:
      - mongo-data:/data/db
    networks:
      - komodo-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == liaxum-mini

  # --- 2. Komodo Core (The Brain) ---
  core:
    image: ghcr.io/moghtech/komodo-core:latest
    depends_on:
      - mongo
    environment:
      - KOMODO_DATABASE_ADDRESS=mongo:27017
      - KOMODO_PASSKEY=secure-liaxum-passkey
      - KOMODO_LOCAL_AUTH=true
      - KOMODO_INIT_ADMIN_USERNAME=admin
      - KOMODO_INIT_ADMIN_PASSWORD=admin
    volumes:
      - komodo-data:/etc/komodo
    networks:
      - web-net      # Public access
      - komodo-net   # Talk to Mongo & Agents
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != liaxum-gaming

      labels:
        # Traefik v3 Config
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        - "traefik.http.routers.komodo.rule=Host(`monitor.liaxum.fr`)"
        - "traefik.http.routers.komodo.entrypoints=websecure"
        - "traefik.http.routers.komodo.tls=true"
        - "traefik.http.services.komodo.loadbalancer.server.port=9120"

  # --- 3. Periphery (The Agents) ---
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:latest
    environment:
      - PERIPHERY_PASSKEY=secure-liaxum-passkey
    ports:
      # Expose port 8120 so Core can reach it via VPN IP
      - target: 8120
        published: 8120
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    deploy:
      mode: global  # Runs on VPS, Mini, Gaming, and any future node
      restart_policy:
        condition: on-failure
    networks:
      - komodo-net

networks:
  web-net:
    external: true
  komodo-net:
    driver: overlay
    attachable: true

volumes:
  mongo-data:
  komodo-data: