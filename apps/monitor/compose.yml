# docker stack deploy -c apps/monitor/compose.yml monitor
#
# The `agent` service runs globally, so periphery instances land on remote
# hardware that cannot see core's local /config/keys. The `keys` volume is
# therefore an NFS mount of /shared/monitor-keys exported by apps/nfs over
# Tailscale, which is how the agents pick up the core.pub that core writes.
services:
  db:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - komodo-net
    deploy:
      placement:
        constraints:
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}

  core:
    image: ghcr.io/moghtech/komodo-core:2
    environment:
      - KOMODO_DATABASE_ADDRESS=db:27017
      - KOMODO_JWT_SECRET=super_secret_jwt_12345
      - KOMODO_WEBHOOK_SECRET=super_secret_webhook_12345
      - KOMODO_LOCAL_AUTH=true
    volumes:
      - keys:/config/keys
    networks:
      - web-net
      - komodo-net
    deploy:
      placement:
        constraints:
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        - "traefik.http.routers.komodo.rule=Host(`monitor.${DOMAIN:-liaxum.fr}`)"
        - "traefik.http.routers.komodo.entrypoints=websecure"
        - "traefik.http.routers.komodo.tls=true"
        - "traefik.http.services.komodo.loadbalancer.server.port=9120"

  agent:
    image: ghcr.io/moghtech/komodo-periphery:2
    environment:
      - PERIPHERY_CORE_ADDRESS=wss://monitor.${DOMAIN:-liaxum.fr}
      - PERIPHERY_CONNECT_AS={{ .Node.Hostname }}
      - PERIPHERY_CORE_PUBLIC_KEYS=file:/config/keys/core.pub
      - PERIPHERY_ONBOARDING_KEY=O_MtvPL47OpYgEqArluFsbv6nXjR0U_O
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
    networks:
      - komodo-net
    deploy:
      mode: global

  mcp:
    image: ghcr.io/myrikld/komodo-mcp:latest
    environment:
      - KOMODO_MCP_KOMODO_URL=https://monitor.${DOMAIN:-liaxum.fr}
      - KOMODO_MCP_KOMODO_API_KEY=K_d7XqOnTpGduUmUH74C7t8iwhhCgYN4qqgczNGN64_K
      - KOMODO_MCP_KOMODO_API_SECRET=S_7nqRoUAZtzENIX0slKeb2siVleJfUg1j7beWUTmM_S
    networks:
      - web-net
      - komodo-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${MANAGER_HOSTNAME:-liaxum-vps}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=web-net"
        # We will expose this on a separate subdomain for the AI
        - "traefik.http.routers.komodomcp.rule=Host(`mcp.${DOMAIN:-liaxum.fr}`)"
        - "traefik.http.routers.komodomcp.entrypoints=websecure"
        - "traefik.http.routers.komodomcp.tls=true"
        - "traefik.http.services.komodomcp.loadbalancer.server.port=8000"

networks:
  web-net:
    external: true
  komodo-net:
    driver: overlay
    attachable: true

volumes:
  mongo-data:
  mongo-config:
  keys:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${MESH_ADDR:-100.64.0.1},rw,nfsvers=4,nolock,soft,nosuid,nodev"
      # Path is relative to the NFSv4 root, which the export pins to /shared
      # with fsid=0 -- so this is /shared/monitor-keys on the server.
      device: ":/monitor-keys"