# go2rtc expands ${VAR} itself, from the container environment that
# compose.yml fills in -- compose does not interpolate mounted files.
streams:
  # The X2D serves RTSPS on 322 only once "LAN Only Liveview" is switched on
  # under Settings > General on the printer; until then it reports its stream
  # URL as "disable" and this connection is refused. See "Printer stream" in
  # the README.
  #
  # rtspx is go2rtc's RTSPS without certificate verification. The printer's
  # certificate is issued by Bambu's own CA for the serial number, not for the
  # address used here, so verification could never pass.
  printer: rtspx://bblp:${BAMBU_ACCESS_CODE}@${BAMBU_HOST}:322/streaming/live/1

api:
  listen: ":1984"

rtsp:
  listen: ":8554"
