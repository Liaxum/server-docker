# Standalone compose (NOT a swarm stack), on liaxum-mini only:
#
#   cd apps/printcast && cp .env.example .env    # fill it in
#   docker compose up -d --build
#
# or as a Komodo Stack on the liaxum-mini server pointed at this directory,
# with the same variables in its environment.
#
# Live-streams the Bambu Lab X2D on the mini PC's LAN, camera and print
# telemetry composited by BambuBoard into one page that OBS captures:
#
#   printer --rtsps:322 + mqtts:8883--> bambuboard --http:8080 /live--> obs --> Twitch/YouTube
#
# Standalone for the same reason as apps/nfs: swarm cannot give a service what
# this one needs.
#   - Ports bound to one address. Swarm's port syntax has no host_ip (see
#     apps/pihole), so every UI here would listen on every interface of the
#     mini PC -- its LAN included. Standalone compose binds them to the mesh
#     address and nothing else. For BambuBoard that is the only access
#     control there is: its setup and layout pages have no login.
#   - devices. Swarm services cannot be handed /dev/dri, and without the iGPU
#     OBS encodes in software, which a mini PC cannot sustain at 1080p30.
#   - shm_size. Also unsupported by `docker stack deploy`; the browser desktop
#     OBS is drawn into needs more than the 64 MB default.
#
# Nothing here holds state anyone else needs, so it does not touch the NFS
# share and is not pinned with a placement constraint: it runs wherever
# `docker compose up` is run, which has to be the mini PC because that is
# the machine on the printer's LAN.
name: printcast

services:
  # Holds the printer's MQTT and camera connections and serves the overlay:
  # /live is the published layout, camera included, for OBS; / is the
  # management UI for setup and layout.
  bambuboard:
    image: ghcr.io/t0nyz0/bambuboard:latest
    restart: unless-stopped
    environment:
      # Required, with no defaults: there is no value that is right for every
      # install. ":?" fails the deploy instead of starting against nothing.
      #
      # BambuBoard applies these over whatever Setup saved, on every start, so
      # the stack environment -- not the UI -- is where the printer is defined.
      - BAMBUBOARD_PRINTER_URL=${BAMBU_HOST:?set BAMBU_HOST to the printer's LAN address}
      - BAMBUBOARD_PRINTER_SN=${BAMBU_SERIAL:?set BAMBU_SERIAL to the printer's serial number}
      - BAMBUBOARD_PRINTER_ACCESS_CODE=${BAMBU_ACCESS_CODE:?set BAMBU_ACCESS_CODE from the printer's network settings}
      - BAMBUBOARD_PRINTER_NAME=${BAMBU_NAME:-X2D}
      # BambuBoard has no X2D profile of its own and maps it to its H2D one,
      # the nearest dual-nozzle model. Stated here because the image defaults
      # to X1, which is single-nozzle and would gate off the second nozzle and
      # AMS widgets until MQTT detection corrected it.
      - BAMBUBOARD_PRINTER_TYPE=H2D
    volumes:
      # Setup, layouts and the published /live snapshot.
      - bambuboard-data:/usr/src/app/data
    ports:
      - "${MINI_MESH_ADDR:?set MINI_MESH_ADDR to liaxum-mini's Tailscale address}:${BAMBUBOARD_PORT:-8080}:8080"

  # OBS Studio in a browser-reachable desktop. See obs/Dockerfile for why it
  # is built here rather than pulled.
  obs:
    build: ./obs
    image: printcast-obs:local
    restart: unless-stopped
    depends_on:
      - bambuboard
    shm_size: "1gb"
    devices:
      # The iGPU, for VAAPI encoding. Remove this line on a host without
      # /dev/dri -- compose refuses to create the container if it is missing.
      - /dev/dri:/dev/dri
    environment:
      - PUID=${OBS_PUID:-1000}
      - PGID=${OBS_PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      # Basic auth on the desktop. Mesh-only is not the same as trusted: every
      # node on the tailnet could otherwise drive OBS and read the stream key.
      - CUSTOM_USER=${OBS_USER:-admin}
      - PASSWORD=${OBS_PASSWORD:?set OBS_PASSWORD for the OBS desktop}
    volumes:
      # Scenes, profiles and the stream key.
      - obs-config:/config
    ports:
      # HTTPS only: the Selkies desktop refuses to run over plain HTTP. The
      # certificate is self-signed, so the browser will warn once.
      - "${MINI_MESH_ADDR}:${OBS_PORT:-3001}:3001"

volumes:
  bambuboard-data:
  obs-config:
